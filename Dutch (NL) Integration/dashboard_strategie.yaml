          - type: entities
            title: Weerdata
            entities:
              - entity: input_text.dynamisch_buitentemperatuur_sensor
                name: Buitentemp sensor
              - entity: input_text.dynamisch_weather_entity
                name: Weer forecast
            show_header_toggle: false
            state_color: false
          - type: markdown
            title: Parameter uitleg
            content: >-
              **Analyseperiode**: aantal dagen recorder-history voor het
              automatische strategieadvies. Korter reageert sneller, langer is
              stabieler.


              **Warmtestraf laden**: weegt warmteverlies door hoge C-waarde
              tijdens laden. Hoger betekent vaker lager laadvermogen.


              **Warmtestraf ontladen**: weegt warmteverlies door hoge C-waarde
              tijdens ontladen. Hoger betekent vaker lager
              ontlaadvermogen.


              **Afkoeling halveertijd**: aantal rust-uren waarin het
              temperatuurverschil tussen batterij en buitenlucht halveert.


              **Opwarming laden**: accutemperatuurstijging in graden per C² ×
              uur tijdens laden. Hoger betekent sneller voorspelde opwarming
              tijdens laden.


              **Opwarming ontladen**: accutemperatuurstijging in graden per C²
              × uur tijdens ontladen. Hoger betekent sneller voorspelde
              opwarming tijdens ontladen.


              **Max temp bij SoC >80%**: gewenste maximale
              batterijtemperatuur wanneer de planning boven 80% SoC uitkomt.


              **Max temp bij SoC <80%**: gewenste maximale
              batterijtemperatuur wanneer de planning onder 80% SoC blijft.


              **Straf boven temp-limiet**: weegt overschrijding van de gekozen
              temperatuurgrens. `0` schakelt deze extra straf
              uit.


              **Extra straf 100% SoC**: extra weging voor
              temperatuur-overschrijding tussen 90% en 100% SoC. `1` betekent
              geen extra weging; `2` verdubbelt de straf bij 100% SoC.


              **Straf SoC >90%**: zachte euro-straf voor tijd boven 90% SoC.
              Hogere temperatuur maakt deze straf
              zwaarder.


              **Straf SoC <10%**: zachte euro-straf voor tijd onder 10% SoC.
              Deze instelling bewaart extra reserve.


              **Standbyverbruik**: batterijverbruik in watt tijdens rust en
              ontladen. Bij `5 W` trekt de strategie 5 Wh per uur af van de
              batterij-SoC zolang het slot niet laadt.


              **Minimum laad/ontlaadvermogen**: laagste vermogensopdracht die
              de strategie mag kiezen. Rust met `0 W` blijft altijd mogelijk.
              De DP test het minimum, tussenstappen van `250 W` en altijd ook
              het exacte maximale laad- en ontlaadvermogen. Een maximum van
              bijvoorbeeld `2150 W` hoeft dus geen veelvoud van `250 W` te
              zijn. Een lagere opdracht kan toch dezelfde afgeronde
              SoC-overgang bereiken en wordt dan bewust behouden.


              **Buitentemp sensor**: optionele `sensor.*` voor actuele
              buitentemperatuur. Laat leeg als je alleen `weather.openweathermap`
              hebt.


              **Weer forecast**: `weather.*` entity voor `weather.get_forecasts`,
              bijvoorbeeld `weather.openweathermap`.
