            yaxis:
              - id: penalty
                decimals: 2
                min: -5
                max: 5
                apex_config:
                  labels:
                    formatter: |
                      EVAL:function(v) { return v.toFixed(1) + ' ct' }
              - id: helper
                show: false
            apex_config:
              tooltip:
                custom: |
                  EVAL:function({ series, seriesIndex, dataPointIndex, w }) {
                    var currentX = w.globals.seriesX[seriesIndex] || [];
                    var ts = currentX[dataPointIndex];
                    var valueAtTimestamp = function(idx) {
                      var xs = w.globals.seriesX[idx] || [];
                      var ys = series[idx] || [];
                      for (var i = 0; i < xs.length; i++) {
                        if (xs[i] === ts) return ys[i];
                      }
                      return null;
                    };
                    var actionCode = valueAtTimestamp(4);
                    var vermogen = valueAtTimestamp(5);
                    var c = valueAtTimestamp(6);
                    var tempVoor = valueAtTimestamp(7);
                    var tempNa = valueAtTimestamp(8);
                    var warmte = valueAtTimestamp(9);
                    var overtempPenalty = valueAtTimestamp(10);
                    var socVerblijfPenalty = valueAtTimestamp(11);
                    var hogeSocPenalty = valueAtTimestamp(12);
                    var lageSocPenalty = valueAtTimestamp(13);
                    var tempLimietVoor = valueAtTimestamp(14);
                    var tempLimietNa = valueAtTimestamp(15);
                    var actieLabel = actionCode === 1 ? 'Laden' : actionCode === 2 ? 'Ontladen' : 'Rust';
                    if (!ts) return '';
                    var d = new Date(ts);
                    var pad = function(n) { return String(n).padStart(2, '0'); };
                    var time = pad(d.getDate()) + '-' + pad(d.getMonth()+1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
                    var html = '<div style="padding:8px 12px;font-size:0.85em;background:var(--card-background-color);border:1px solid var(--divider-color);border-radius:4px">';
                    html += '<div style="margin-bottom:4px;font-weight:bold;color:var(--primary-text-color)">' + time + '</div>';
                    html += '<div style="color:var(--secondary-text-color)">Actie: <span style="color:var(--primary-text-color);font-weight:bold">' + actieLabel + '</span></div>';
                    html += '<div style="color:var(--secondary-text-color)">Vermogen: <span style="color:var(--primary-text-color);font-weight:bold">' + Math.round(vermogen || 0) + ' W</span></div>';
                    html += '<div style="color:var(--secondary-text-color)">C-waarde: <span style="color:var(--primary-text-color);font-weight:bold">' + (c != null ? c.toFixed(3) : '-') + '</span></div>';
                    html += '<div style="color:var(--secondary-text-color)">Accutemp: <span style="color:var(--primary-text-color);font-weight:bold">' + (tempVoor != null ? tempVoor.toFixed(1) : '-') + ' → ' + (tempNa != null ? tempNa.toFixed(1) : '-') + ' °C</span></div>';
                    html += '<div style="color:var(--secondary-text-color)">Temp limiet: <span style="color:var(--primary-text-color);font-weight:bold">' + (tempLimietVoor != null ? tempLimietVoor.toFixed(1) : '-') + ' → ' + (tempLimietNa != null ? tempLimietNa.toFixed(1) : '-') + ' °C</span></div>';
                    html += '<div style="color:var(--secondary-text-color)">Warmtestraf: <span style="color:var(--primary-text-color);font-weight:bold">' + (warmte != null ? warmte.toFixed(2) : '0.00') + ' ct</span></div>';
                    html += '<div style="color:var(--secondary-text-color)">Temp-straf: <span style="color:var(--primary-text-color);font-weight:bold">' + (overtempPenalty != null ? overtempPenalty.toFixed(3) : '0.000') + ' ct</span></div>';
                    html += '<div style="color:var(--secondary-text-color)">SoC-straf: <span style="color:var(--primary-text-color);font-weight:bold">' + (socVerblijfPenalty != null ? socVerblijfPenalty.toFixed(3) : '0.000') + ' ct</span></div>';
                    html += '<div style="color:var(--secondary-text-color)">SoC >90% / <10%: <span style="color:var(--primary-text-color);font-weight:bold">' + (hogeSocPenalty != null ? hogeSocPenalty.toFixed(3) : '0.000') + ' / ' + (lageSocPenalty != null ? lageSocPenalty.toFixed(3) : '0.000') + ' ct</span></div>';
                    html += '</div>';
                    return html;
                  }
              chart:
                height: 220px
                toolbar:
                  show: false
                zoom:
                  enabled: false
              legend:
                show: true
              markers:
                size: 0
