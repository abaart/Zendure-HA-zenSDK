views:
  - type: sections
    max_columns: 3
    title: Strategie
    path: strategie
    icon: mdi:cash-plus
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Dynamisch Handelen — Strategie
            heading_style: title
            badges:
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.dynamisch_handelsstrategie
                color: '#01a180'
                tap_action:
                  action: more-info
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.zendure_2400_ac_laadpercentage
                color: '#01a180'
                tap_action:
                  action: more-info

          - type: custom:apexcharts-card
            cache: false
            update_delay: 2s
            header:
              show: true
              show_states: true
              title: Geplande SoC en prijzen
            graph_span: 48h
            span:
              start: hour
            now:
              show: true
              label: Nu
              color: '#ef5350'
            series:
              - entity: sensor.dynamisch_handelsstrategie
                name: SoC
                type: area
                curve: stepline
                color: '#01a180'
                opacity: 0.2
                stroke_width: 2
                float_precision: 0
                unit: '%'
                yaxis_id: percentage
                show:
                  in_chart: true
                  in_header: true
                  in_legend: true
                data_generator: |
                  const slots = entity.attributes.slots || [];
                  const pts = slots.map(s => [new Date(s.start).getTime(), s.soc_voor_pct ?? 0]);
                  if (slots.length) {
                    const last = slots[slots.length - 1];
                    pts.push([new Date(last.end).getTime(), last.soc_na_pct ?? 0]);
                  }
                  return pts;
              - entity: sensor.dynamisch_handelsstrategie
                name: Prijs
                type: line
                curve: stepline
                color: '#ff9800'
                stroke_width: 2
                float_precision: 1
                unit: 'ct/kWh'
                yaxis_id: prijs
                show:
                  in_chart: true
                  in_header: true
                  in_legend: true
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.prijs_ct
                  ]);
              - entity: sensor.dynamisch_handelsstrategie
                name: Vermogen
                type: line
                stroke_width: 0
                opacity: 0
                yaxis_id: extra
                show:
                  in_chart: true
                  in_header: false
                  in_legend: false
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.actie !== 'rust' ? (s.vermogen_w ?? 0) : null
                  ]);
              - entity: sensor.dynamisch_handelsstrategie
                name: Actie
                type: line
                stroke_width: 0
                opacity: 0
                yaxis_id: extra
                show:
                  in_chart: true
                  in_header: false
                  in_legend: false
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.actie === 'laden' ? 1 : s.actie === 'ontladen' ? 2 : 0
                  ]);
              - entity: sensor.dynamisch_handelsstrategie
                name: Spread te klein
                type: column
                color: '#ef5350'
                opacity: 0.45
                yaxis_id: prijs
                float_precision: 1
                unit: 'ct/kWh'
                show:
                  in_chart: true
                  in_header: false
                  in_legend: true
                data_generator: |
                  const slots = entity.attributes.slots || [];
                  return slots.map(s => {
                    const ts = new Date(s.start).getTime();
                    const prijs = Number(s.prijs_ct);
                    if (s.geen_laden_reden !== 'spread_te_klein' || !Number.isFinite(prijs)) {
                      return [ts, null];
                    }
                    return [ts, prijs];
                  });
              - entity: sensor.dynamisch_handelsstrategie
                name: Beste verkoop
                type: line
                stroke_width: 0
                opacity: 0
                yaxis_id: extra
                show:
                  in_chart: true
                  in_header: false
                  in_legend: false
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.geen_laden_reden === 'spread_te_klein' ? s.beste_verkoop_ct : null
                  ]);
              - entity: sensor.dynamisch_handelsstrategie
                name: Nodig bij drempel
                type: line
                stroke_width: 0
                opacity: 0
                yaxis_id: extra
                show:
                  in_chart: true
                  in_header: false
                  in_legend: false
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.geen_laden_reden === 'spread_te_klein' ? s.benodigde_verkoop_ct : null
                  ]);
              - entity: sensor.dynamisch_handelsstrategie
                name: Min spread
                type: line
                stroke_width: 0
                opacity: 0
                yaxis_id: extra
                show:
                  in_chart: true
                  in_header: false
                  in_legend: false
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.geen_laden_reden === 'spread_te_klein' ? s.min_spread_ct : null
                  ]);
              - entity: sensor.dynamisch_handelsstrategie
                name: Spread tekort
                type: line
                stroke_width: 0
                opacity: 0
                yaxis_id: extra
                show:
                  in_chart: true
                  in_header: false
                  in_legend: false
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.geen_laden_reden === 'spread_te_klein' ? s.spread_tekort_ct : null
                  ]);
              - entity: input_boolean.dynamisch_handelsstrategie_berekening_bezig
                name: Refresh trigger
                type: line
                show:
                  in_chart: false
                  in_header: false
                  in_legend: false
                data_generator: |
                  return [[Date.now(), entity.state === 'on' ? 1 : 0]];
            apex_config:
              tooltip:
                custom: |
                  EVAL:function({ series, seriesIndex, dataPointIndex, w }) {
                    var soc = series[0][dataPointIndex];
                    var prijs = series[1][dataPointIndex];
                    var vermogen = series[2][dataPointIndex];
                    var actieCode = series[3][dataPointIndex];
                    var spreadBlokkade = series[4][dataPointIndex];
                    var besteVerkoop = series[5][dataPointIndex];
                    var nodigeVerkoop = series[6][dataPointIndex];
                    var minSpread = series[7][dataPointIndex];
                    var spreadTekort = series[8][dataPointIndex];
                    var actieLabel = actieCode === 1 ? 'Laden' : actieCode === 2 ? 'Ontladen' : 'Rust';
                    var ts = w.globals.seriesX[0] && w.globals.seriesX[0][dataPointIndex];
                    if (!ts) return '';
                    var d = new Date(ts);
                    var pad = function(n) { return String(n).padStart(2, '0'); };
                    var time = pad(d.getDate()) + '-' + pad(d.getMonth()+1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
                    var html = '<div style="padding:8px 12px;font-size:0.85em;background:var(--card-background-color);border:1px solid var(--divider-color);border-radius:4px">';
                    html += '<div style="margin-bottom:4px;font-weight:bold;color:var(--primary-text-color)">' + time + '</div>';
                    html += '<div style="color:var(--secondary-text-color)">SoC&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;: <span style="color:var(--primary-text-color);font-weight:bold">' + (soc != null ? soc.toFixed(0) + ' %' : '\u2014') + '</span></div>';
                    html += '<div style="color:var(--secondary-text-color)">Prijs&nbsp;&nbsp;&nbsp;&nbsp;: <span style="color:var(--primary-text-color);font-weight:bold">' + (prijs != null ? prijs.toFixed(1) + ' ct/kWh' : '\u2014') + '</span></div>';
                    html += '<div style="color:var(--secondary-text-color)">Actie&nbsp;&nbsp;&nbsp;&nbsp;: <span style="color:var(--primary-text-color);font-weight:bold">' + actieLabel + '</span></div>';
                    if (actieCode) { html += '<div style="color:var(--secondary-text-color)">Vermogen : <span style="color:var(--primary-text-color);font-weight:bold">' + (vermogen != null ? Math.round(vermogen) + ' W' : '\u2014') + '</span></div>'; }
                    if (spreadBlokkade != null && besteVerkoop != null && nodigeVerkoop != null && minSpread != null && spreadTekort != null) {
                      html += '<div style="margin-top:4px;color:#ef5350;font-weight:bold">Niet laden: spread te klein</div>';
                      html += '<div style="color:var(--secondary-text-color)">Beste verkoop&nbsp;: <span style="color:var(--primary-text-color);font-weight:bold">' + besteVerkoop.toFixed(1) + ' ct</span></div>';
                      html += '<div style="color:var(--secondary-text-color)">Nodig bij drempel: <span style="color:var(--primary-text-color);font-weight:bold">' + nodigeVerkoop.toFixed(1) + ' ct</span></div>';
                      html += '<div style="color:var(--secondary-text-color)">Min. spread&nbsp;&nbsp;&nbsp;: <span style="color:var(--primary-text-color);font-weight:bold">' + minSpread.toFixed(1) + ' ct</span></div>';
                      html += '<div style="color:var(--secondary-text-color)">Tekort&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;: <span style="color:var(--primary-text-color);font-weight:bold">' + spreadTekort.toFixed(1) + ' ct</span></div>';
                    }
                    html += '</div>';
                    return html;
                  }
              xaxis:
                labels:
                  style:
                    colors: >-
                      color-mix(in srgb, var(--primary-text-color) 75%,
                      transparent)
                axisTicks:
                  show: false
                axisBorder:
                  color: >-
                    color-mix(in srgb, var(--divider-color) 50%,
                    transparent)
              yaxis:
                - id: percentage
                  seriesName: SoC
                  min: 0
                  max: 105
                  decimalsInFloat: 0
                  labels:
                    style:
                      colors: >-
                        color-mix(in srgb, var(--primary-text-color) 75%,
                        transparent)
                    formatter: |
                      EVAL:function(v) { return v.toFixed(0) + ' %' }
                - id: prijs
                  seriesName: Prijs
                  opposite: true
                  decimalsInFloat: 0
                  labels:
                    style:
                      colors: >-
                        color-mix(in srgb, var(--primary-text-color) 75%,
                        transparent)
                    formatter: |
                      EVAL:function(v) { return v.toFixed(0) + ' ct' }
                - id: extra
                  seriesName: Vermogen
                  show: false
              grid:
                strokeDashArray: 0
                borderColor: >-
                  color-mix(in srgb, var(--divider-color) 50%,
                  transparent)
                show: true
              chart:
                height: 300px
                toolbar:
                  show: false
                zoom:
                  enabled: false
              legend:
                show: true
                floating: true
                horizontalAlign: left
                offsetX: 25
                offsetY: 17
              markers:
                size: 0
                hover:
                  size: 0

          - type: custom:apexcharts-card
            experimental:
              hidden_by_default: true
              color_threshold: true
            cache: false
            update_delay: 2s
            header:
              show: true
              show_states: false
              title: Geplande acties (groen = laden, oranje = ontladen)
            graph_span: 48h
            span:
              start: hour
            now:
              show: true
              label: Nu
              color: '#ef5350'
            series:
              - entity: sensor.dynamisch_handelsstrategie
                name: Vermogen
                type: column
                float_precision: 0
                unit: 'W'
                color_threshold:
                  - value: -9999
                    color: '#ff7043'
                  - value: 0
                    color: '#66bb6a'
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.actie === 'laden'    ?  (s.vermogen_w ?? 0) :
                    s.actie === 'ontladen' ? -(s.vermogen_w ?? 0) :
                    null
                  ]);
              - entity: input_boolean.dynamisch_handelsstrategie_berekening_bezig
                name: Refresh trigger
                type: line
                show:
                  in_chart: false
                  in_header: false
                  in_legend: false
                data_generator: |
                  return [[Date.now(), entity.state === 'on' ? 1 : 0]];
            apex_config:
              tooltip:
                x:
                  format: 'dd-MM HH:mm'
              xaxis:
                labels:
                  style:
                    colors: >-
                      color-mix(in srgb, var(--primary-text-color) 75%,
                      transparent)
                axisTicks:
                  show: false
                axisBorder:
                  color: >-
                    color-mix(in srgb, var(--divider-color) 50%,
                    transparent)
              yaxis:
                decimalsInFloat: 0
                labels:
                  style:
                    colors: >-
                      color-mix(in srgb, var(--primary-text-color) 75%,
                      transparent)
                  formatter: |
                    EVAL:function(v) { return Math.abs(v).toFixed(0) + ' W' }
              grid:
                strokeDashArray: 0
                borderColor: >-
                  color-mix(in srgb, var(--divider-color) 50%,
                  transparent)
                show: true
              chart:
                height: 220px
                toolbar:
                  show: false
                zoom:
                  enabled: false
              legend:
                show: false
              markers:
                size: 0
                hover:
                  size: 0

          - type: custom:apexcharts-card
            experimental:
              hidden_by_default: true
              color_threshold: true
            cache: false
            update_delay: 2s
            header:
              show: true
              show_states: false
              title: Verwachte winst per slot (groen = opbrengst, rood = kosten)
            graph_span: 48h
            span:
              start: hour
            now:
              show: true
              label: Nu
              color: '#ef5350'
            series:
              - entity: sensor.dynamisch_handelsstrategie
                name: Winst
                type: column
                float_precision: 2
                unit: 'ct'
                color_threshold:
                  - value: -9999
                    color: '#ef5350'
                  - value: 0
                    color: '#66bb6a'
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    (s.winst_eur ?? 0) !== 0
                      ? parseFloat(((s.winst_eur ?? 0) * 100).toFixed(2))
                      : null
                  ]);
              - entity: input_boolean.dynamisch_handelsstrategie_berekening_bezig
                name: Refresh trigger
                type: line
                show:
                  in_chart: false
                  in_header: false
                  in_legend: false
                data_generator: |
                  return [[Date.now(), entity.state === 'on' ? 1 : 0]];
            apex_config:
              tooltip:
                x:
                  format: 'dd-MM HH:mm'
              xaxis:
                labels:
                  style:
                    colors: >-
                      color-mix(in srgb, var(--primary-text-color) 75%,
                      transparent)
                axisTicks:
                  show: false
                axisBorder:
                  color: >-
                    color-mix(in srgb, var(--divider-color) 50%,
                    transparent)
              yaxis:
                decimalsInFloat: 1
                labels:
                  style:
                    colors: >-
                      color-mix(in srgb, var(--primary-text-color) 75%,
                      transparent)
                  formatter: |
                    EVAL:function(v) { return v.toFixed(1) + ' ct' }
              grid:
                strokeDashArray: 0
                borderColor: >-
                  color-mix(in srgb, var(--divider-color) 50%,
                  transparent)
                show: true
              chart:
                height: 200px
                toolbar:
                  show: false
                zoom:
                  enabled: false
              legend:
                show: false
              markers:
                size: 0
                hover:
                  size: 0

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Instellingen
            heading_style: title

          - type: entities
            entities:
              - entity: input_number.dynamisch_warmte_penalty_laden_factor
                name: Warmte penalty laden factor
              - entity: input_number.dynamisch_warmte_penalty_ontladen_factor
                name: Warmte penalty ontladen factor
              - entity: input_number.dynamisch_warmte_afkoeling_halveringstijd_uren
                name: Afkoeling halveringstijd (uren)
              - entity: input_number.dynamisch_max_temp_boven_80_soc
                name: Max temp boven 80% SoC
              - entity: input_number.dynamisch_temp_penalty_factor
                name: Temperatuur penalty factor
              - entity: input_text.dynamisch_buitentemperatuur_sensor
                name: Buitentemperatuur sensor
              - entity: input_text.dynamisch_weather_entity
                name: Weather entity
            show_header_toggle: false
            state_color: false

          - type: markdown
            title: Parameter uitleg
            content: |-
              **Warmte penalty laden factor**: weegt C-waarde warmteverlies tijdens laden. Hoger betekent vaker lager laadvermogen.

              **Warmte penalty ontladen factor**: weegt C-waarde warmteverlies tijdens ontladen. Hoger betekent vaker lager ontlaadvermogen.

              **Afkoeling halveringstijd**: aantal uren waarin het temperatuurverschil tussen batterij en buitenlucht halveert.

              **Max temp boven 80% SoC**: gewenste maximale batterijtemperatuur wanneer de planning boven 80% SoC uitkomt.

              **Temperatuur penalty factor**: weegt overschrijding van de temperatuurgrens. `0` schakelt deze extra penalty uit.

              **Buitentemperatuur sensor**: optionele `sensor.*` voor actuele buitentemperatuur. Laat leeg als je alleen `weather.openweathermap` hebt.

              **Weather entity**: `weather.*` entity voor `weather.get_forecasts`, bijvoorbeeld `weather.openweathermap`.

          - type: conditional
            conditions:
              - entity: input_boolean.dynamisch_handelsstrategie_berekening_bezig
                state_not: 'on'
            card:
              type: button
              entity: input_button.dynamisch_handelsstrategie_herberekenen
              name: Strategie herberekenen
              icon: mdi:calculator-variant
              show_state: false
              tap_action:
                action: call-service
                service: input_button.press
                target:
                  entity_id: input_button.dynamisch_handelsstrategie_herberekenen

          - type: conditional
            conditions:
              - entity: input_boolean.dynamisch_handelsstrategie_berekening_bezig
                state: 'on'
            card:
              type: button
              entity: input_boolean.dynamisch_handelsstrategie_berekening_bezig
              name: Strategie wordt berekend
              icon: mdi:loading
              show_state: true
              tap_action:
                action: none

          - type: heading
            heading: Thermisch model
            heading_style: title

          - type: custom:apexcharts-card
            cache: false
            update_delay: 2s
            header:
              show: true
              show_states: false
              title: Temperatuur over planning
            graph_span: 48h
            span:
              start: hour
            now:
              show: true
              label: Nu
              color: '#ef5350'
            series:
              - entity: sensor.dynamisch_handelsstrategie
                name: Batterij
                type: line
                curve: smooth
                color: '#009688'
                stroke_width: 2
                unit: '°C'
                yaxis_id: temp
                data_generator: |
                  const slots = entity.attributes.slots || [];
                  const pts = slots.map(s => [
                    new Date(s.start).getTime(),
                    s.batterij_temp_voor_c ?? null
                  ]);
                  if (slots.length) {
                    const last = slots[slots.length - 1];
                    pts.push([
                      new Date(last.end).getTime(),
                      last.batterij_temp_na_c ?? null
                    ]);
                  }
                  return pts;
              - entity: sensor.dynamisch_handelsstrategie
                name: Buiten
                type: line
                curve: stepline
                color: '#42a5f5'
                stroke_width: 1
                unit: '°C'
                yaxis_id: temp
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.buiten_temp_c ?? null
                  ]);
              - entity: sensor.dynamisch_handelsstrategie
                name: Limiet
                type: line
                curve: stepline
                color: '#ef5350'
                stroke_width: 1
                unit: '°C'
                yaxis_id: temp
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.temp_limiet_c ?? entity.attributes.temp_limiet_c ?? null
                  ]);
              - entity: sensor.dynamisch_handelsstrategie
                name: Risico
                type: column
                color: '#ef5350'
                opacity: 0.35
                unit: '°C'
                yaxis_id: temp
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.temp_limiet_actief && (s.temp_penalty_eur ?? 0) > 0
                      ? s.batterij_temp_na_c
                      : null
                  ]);
              - entity: input_boolean.dynamisch_handelsstrategie_berekening_bezig
                name: Refresh trigger
                type: line
                show:
                  in_chart: false
                  in_header: false
                  in_legend: false
                data_generator: |
                  return [[Date.now(), entity.state === 'on' ? 1 : 0]];
            apex_config:
              tooltip:
                x:
                  format: 'dd-MM HH:mm'
              yaxis:
                decimalsInFloat: 1
                labels:
                  formatter: |
                    EVAL:function(v) { return v.toFixed(1) + ' °C' }
              chart:
                height: 220px
                toolbar:
                  show: false
                zoom:
                  enabled: false
              legend:
                show: true
              markers:
                size: 0
                hover:
                  size: 3

          - type: custom:apexcharts-card
            cache: false
            update_delay: 2s
            header:
              show: true
              show_states: false
              title: Warmte-penalty per slot
            graph_span: 48h
            span:
              start: hour
            now:
              show: true
              label: Nu
              color: '#ef5350'
            series:
              - entity: sensor.dynamisch_handelsstrategie
                name: Laden
                type: column
                color: '#66bb6a'
                unit: 'ct'
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.actie === 'laden' ? ((s.warmte_penalty_eur ?? 0) * 100) : null
                  ]);
              - entity: sensor.dynamisch_handelsstrategie
                name: Ontladen
                type: column
                color: '#ff9800'
                unit: 'ct'
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.actie === 'ontladen' ? ((s.warmte_penalty_eur ?? 0) * 100) : null
                  ]);
              - entity: sensor.dynamisch_handelsstrategie
                name: Temp
                type: column
                color: '#ef5350'
                unit: 'ct'
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    (s.temp_penalty_eur ?? 0) > 0 ? ((s.temp_penalty_eur ?? 0) * 100) : null
                  ]);
              - entity: sensor.dynamisch_handelsstrategie
                name: Actie
                type: line
                stroke_width: 0
                opacity: 0
                show:
                  in_chart: true
                  in_header: false
                  in_legend: false
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.actie === 'laden' ? 1 : s.actie === 'ontladen' ? 2 : 0
                  ]);
              - entity: sensor.dynamisch_handelsstrategie
                name: Vermogen
                type: line
                stroke_width: 0
                opacity: 0
                show:
                  in_chart: true
                  in_header: false
                  in_legend: false
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.vermogen_w ?? 0
                  ]);
              - entity: sensor.dynamisch_handelsstrategie
                name: C
                type: line
                stroke_width: 0
                opacity: 0
                show:
                  in_chart: true
                  in_header: false
                  in_legend: false
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.c_waarde ?? 0
                  ]);
              - entity: sensor.dynamisch_handelsstrategie
                name: Temp voor
                type: line
                stroke_width: 0
                opacity: 0
                show:
                  in_chart: true
                  in_header: false
                  in_legend: false
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.batterij_temp_voor_c ?? null
                  ]);
              - entity: sensor.dynamisch_handelsstrategie
                name: Temp na
                type: line
                stroke_width: 0
                opacity: 0
                show:
                  in_chart: true
                  in_header: false
                  in_legend: false
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.batterij_temp_na_c ?? null
                  ]);
              - entity: sensor.dynamisch_handelsstrategie
                name: Warmte ct
                type: line
                stroke_width: 0
                opacity: 0
                show:
                  in_chart: true
                  in_header: false
                  in_legend: false
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    (s.warmte_penalty_eur ?? 0) * 100
                  ]);
              - entity: sensor.dynamisch_handelsstrategie
                name: Temp ct
                type: line
                stroke_width: 0
                opacity: 0
                show:
                  in_chart: true
                  in_header: false
                  in_legend: false
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    (s.temp_penalty_eur ?? 0) * 100
                  ]);
              - entity: input_boolean.dynamisch_handelsstrategie_berekening_bezig
                name: Refresh trigger
                type: line
                show:
                  in_chart: false
                  in_header: false
                  in_legend: false
                data_generator: |
                  return [[Date.now(), entity.state === 'on' ? 1 : 0]];
            apex_config:
              tooltip:
                custom: |
                  EVAL:function({ series, dataPointIndex, w }) {
                    var actionCode = series[3][dataPointIndex];
                    var vermogen = series[4][dataPointIndex];
                    var c = series[5][dataPointIndex];
                    var tempVoor = series[6][dataPointIndex];
                    var tempNa = series[7][dataPointIndex];
                    var warmte = series[8][dataPointIndex];
                    var tempPenalty = series[9][dataPointIndex];
                    var actieLabel = actionCode === 1 ? 'Laden' : actionCode === 2 ? 'Ontladen' : 'Rust';
                    var ts = w.globals.seriesX[0] && w.globals.seriesX[0][dataPointIndex];
                    if (!ts) return '';
                    var d = new Date(ts);
                    var pad = function(n) { return String(n).padStart(2, '0'); };
                    var time = pad(d.getDate()) + '-' + pad(d.getMonth()+1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
                    var html = '<div style="padding:8px 12px;font-size:0.85em;background:var(--card-background-color);border:1px solid var(--divider-color);border-radius:4px">';
                    html += '<div style="margin-bottom:4px;font-weight:bold;color:var(--primary-text-color)">' + time + '</div>';
                    html += '<div style="color:var(--secondary-text-color)">Actie: <span style="color:var(--primary-text-color);font-weight:bold">' + actieLabel + '</span></div>';
                    html += '<div style="color:var(--secondary-text-color)">Vermogen: <span style="color:var(--primary-text-color);font-weight:bold">' + Math.round(vermogen || 0) + ' W</span></div>';
                    html += '<div style="color:var(--secondary-text-color)">C-waarde: <span style="color:var(--primary-text-color);font-weight:bold">' + (c != null ? c.toFixed(3) : '-') + '</span></div>';
                    html += '<div style="color:var(--secondary-text-color)">Pack temp: <span style="color:var(--primary-text-color);font-weight:bold">' + (tempVoor != null ? tempVoor.toFixed(1) : '-') + ' → ' + (tempNa != null ? tempNa.toFixed(1) : '-') + ' °C</span></div>';
                    html += '<div style="color:var(--secondary-text-color)">Warmte penalty: <span style="color:var(--primary-text-color);font-weight:bold">' + (warmte != null ? warmte.toFixed(2) : '0.00') + ' ct</span></div>';
                    html += '<div style="color:var(--secondary-text-color)">Temp penalty: <span style="color:var(--primary-text-color);font-weight:bold">' + (tempPenalty != null ? tempPenalty.toFixed(2) : '0.00') + ' ct</span></div>';
                    html += '</div>';
                    return html;
                  }
              yaxis:
                decimalsInFloat: 2
                labels:
                  formatter: |
                    EVAL:function(v) { return v.toFixed(1) + ' ct' }
              chart:
                height: 220px
                stacked: true
                toolbar:
                  show: false
                zoom:
                  enabled: false
              legend:
                show: true
              markers:
                size: 0

