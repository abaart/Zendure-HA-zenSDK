sql:
  - name: "Zendure 2400 AC Handelsresultaat Totaal"
    unique_id: zendure_2400_ac_handelsresultaat_totaal
    db_url: "sqlite:////share/zendure_kwartieren.sqlite"
    query: >-
      SELECT ROUND(
        COALESCE(
          (SELECT CAST(value AS REAL) FROM ledger_meta
           WHERE key = 'legacy_net_result_eur'),
          0
        ) +
        COALESCE(
          (SELECT SUM(net_result_eur) FROM zendure_quarters
           WHERE status = 'complete'),
          0
        ),
        4
      ) AS value;
    column: value
    unit_of_measurement: "EUR"
    device_class: monetary
    state_class: total
    icon: mdi:cash-multiple

