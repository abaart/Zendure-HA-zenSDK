  - name: "Zendure 2400 AC Resultaat Laatste Kwartier"
    unique_id: zendure_2400_ac_resultaat_laatste_kwartier
    db_url: "sqlite:////share/zendure_kwartieren.sqlite"
    query: >-
      SELECT ROUND(
        COALESCE(
          (SELECT net_result_eur FROM zendure_quarters
           WHERE status = 'complete'
           ORDER BY quarter_start DESC
           LIMIT 1),
          0
        ),
        4
      ) AS value;
    column: value
    unit_of_measurement: "EUR"
    device_class: monetary
    state_class: measurement
    icon: mdi:cash-clock
