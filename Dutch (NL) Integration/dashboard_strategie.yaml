views:
  - type: sections
    max_columns: 3
    title: Strategie
    path: strategie
    icon: mdi:cash-plus
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Dynamisch Handelen — Strategie
            heading_style: title
            badges:
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.dynamisch_handelsstrategie
                color: '#01a180'
                tap_action:
                  action: more-info
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.zendure_2400_ac_laadpercentage
                color: '#01a180'
                tap_action:
                  action: more-info
          - type: custom:apexcharts-card
            cache: false
            update_delay: 2s
            header:
              show: true
              show_states: true
              title: Geplande SoC en prijzen
            graph_span: 48h
            span:
              start: hour
            now:
              show: true
              label: Nu
              color: '#ef5350'
            series:
              - entity: sensor.dynamisch_handelsstrategie
                name: SoC
                type: area
                curve: stepline
                extend_to: false
                color: '#01a180'
                opacity: 0.2
                stroke_width: 2
                float_precision: 0
                unit: '%'
                yaxis_id: percentage
                show:
                  in_chart: true
                  in_header: true
                  in_legend: true
                data_generator: >
                  const slots = entity.attributes.slots || [];

                  const pts = slots.map(s => [new Date(s.start).getTime(),
                  s.soc_voor_pct ?? 0]);

                  if (slots.length) {
                    const last = slots[slots.length - 1];
                    pts.push([new Date(last.end).getTime(), last.soc_na_pct ?? 0]);
                  }

                  return pts;
              - entity: sensor.dynamisch_handelsstrategie
                name: Prijs
                type: line
                curve: stepline
                extend_to: false
                color: '#ff9800'
                stroke_width: 2
                float_precision: 1
                unit: ct/kWh
                yaxis_id: prijs
                show:
                  in_chart: true
                  in_header: true
                  in_legend: true
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.prijs_ct
                  ]);
              - entity: sensor.dynamisch_handelsstrategie
                name: Vermogen
                type: line
                extend_to: false
                stroke_width: 0
                opacity: 0
                yaxis_id: extra
                show:
                  in_chart: true
                  in_header: false
                  in_legend: false
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.actie !== 'rust' ? (s.vermogen_w ?? 0) : null
                  ]);
              - entity: sensor.dynamisch_handelsstrategie
                name: Actie
                type: line
                extend_to: false
                stroke_width: 0
                opacity: 0
                yaxis_id: extra
                show:
                  in_chart: true
                  in_header: false
                  in_legend: false
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.actie === 'laden' ? 1 : s.actie === 'ontladen' ? 2 : 0
                  ]);
              - entity: sensor.dynamisch_handelsstrategie
                name: Stop-SoC
                type: line
                extend_to: false
                stroke_width: 0
                opacity: 0
                yaxis_id: extra
                show:
                  in_chart: true
                  in_header: false
                  in_legend: false
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.stop_soc_pct ?? null
                  ]);
              - entity: sensor.dynamisch_handelsstrategie
                name: Spread te klein
                type: column
                extend_to: false
                color: '#ef5350'
                opacity: 0.45
                yaxis_id: prijs
                float_precision: 1
                unit: ct/kWh
                show:
                  in_chart: true
                  in_header: false
                  in_legend: true
                data_generator: |
                  const slots = entity.attributes.slots || [];
                  return slots.map(s => {
                    const ts = new Date(s.start).getTime();
                    const prijs = Number(s.prijs_ct);
                    if (s.geen_laden_reden !== 'spread_te_klein' || !Number.isFinite(prijs)) {
                      return [ts, null];
                    }
                    return [ts, prijs];
                  });
              - entity: sensor.dynamisch_handelsstrategie
                name: Beste verkoop
                type: line
                extend_to: false
                stroke_width: 0
                opacity: 0
                yaxis_id: extra
                show:
                  in_chart: true
                  in_header: false
                  in_legend: false
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.geen_laden_reden === 'spread_te_klein' ? s.beste_verkoop_ct : null
                  ]);
              - entity: sensor.dynamisch_handelsstrategie
                name: Nodig bij drempel
                type: line
                extend_to: false
                stroke_width: 0
                opacity: 0
                yaxis_id: extra
                show:
                  in_chart: true
                  in_header: false
                  in_legend: false
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.geen_laden_reden === 'spread_te_klein' ? s.benodigde_verkoop_ct : null
                  ]);
              - entity: sensor.dynamisch_handelsstrategie
                name: Min spread
                type: line
                extend_to: false
                stroke_width: 0
                opacity: 0
                yaxis_id: extra
                show:
                  in_chart: true
                  in_header: false
                  in_legend: false
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.geen_laden_reden === 'spread_te_klein' ? s.min_spread_ct : null
                  ]);
              - entity: sensor.dynamisch_handelsstrategie
                name: Spread tekort
                type: line
                extend_to: false
                stroke_width: 0
                opacity: 0
                yaxis_id: extra
                show:
                  in_chart: true
                  in_header: false
                  in_legend: false
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.geen_laden_reden === 'spread_te_klein' ? s.spread_tekort_ct : null
                  ]);
              - entity: input_boolean.dynamisch_handelsstrategie_berekening_bezig
                name: Refresh trigger
                type: line
                show:
                  in_chart: false
                  in_header: false
                  in_legend: false
                data_generator: |
                  return [[Date.now(), entity.state === 'on' ? 1 : 0]];
            apex_config:
              tooltip:
                custom: |
                  EVAL:function({ series, seriesIndex, dataPointIndex, w }) {
                    var soc = series[0][dataPointIndex];
                    var prijs = series[1][dataPointIndex];
                    var vermogen = series[2][dataPointIndex];
                    var actieCode = series[3][dataPointIndex];
                    var stopSoc = series[4][dataPointIndex];
                    var spreadBlokkade = series[5][dataPointIndex];
                    var besteVerkoop = series[6][dataPointIndex];
                    var nodigeVerkoop = series[7][dataPointIndex];
                    var minSpread = series[8][dataPointIndex];
                    var spreadTekort = series[9][dataPointIndex];
                    var actieLabel = actieCode === 1 ? 'Laden' : actieCode === 2 ? 'Ontladen' : 'Rust';
                    var ts = w.globals.seriesX[0] && w.globals.seriesX[0][dataPointIndex];
                    if (!ts) return '';
                    var d = new Date(ts);
                    var pad = function(n) { return String(n).padStart(2, '0'); };
                    var time = pad(d.getDate()) + '-' + pad(d.getMonth()+1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
                    var html = '<div style="padding:8px 12px;font-size:0.85em;background:var(--card-background-color);border:1px solid var(--divider-color);border-radius:4px">';
                    html += '<div style="margin-bottom:4px;font-weight:bold;color:var(--primary-text-color)">' + time + '</div>';
                    html += '<div style="color:var(--secondary-text-color)">SoC&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;: <span style="color:var(--primary-text-color);font-weight:bold">' + (soc != null ? soc.toFixed(0) + ' %' : '\u2014') + '</span></div>';
                    html += '<div style="color:var(--secondary-text-color)">Prijs&nbsp;&nbsp;&nbsp;&nbsp;: <span style="color:var(--primary-text-color);font-weight:bold">' + (prijs != null ? prijs.toFixed(1) + ' ct/kWh' : '\u2014') + '</span></div>';
                    html += '<div style="color:var(--secondary-text-color)">Actie&nbsp;&nbsp;&nbsp;&nbsp;: <span style="color:var(--primary-text-color);font-weight:bold">' + actieLabel + '</span></div>';
                    if (actieCode) { html += '<div style="color:var(--secondary-text-color)">Vermogen : <span style="color:var(--primary-text-color);font-weight:bold">' + (vermogen != null ? Math.round(vermogen) + ' W' : '\u2014') + '</span></div>'; }
                    if (actieCode && stopSoc != null) { html += '<div style="color:var(--secondary-text-color)">Stop-SoC: <span style="color:var(--primary-text-color);font-weight:bold">' + stopSoc.toFixed(1) + ' %</span></div>'; }
                    if (spreadBlokkade != null && besteVerkoop != null && nodigeVerkoop != null && minSpread != null && spreadTekort != null) {
                      html += '<div style="margin-top:4px;color:#ef5350;font-weight:bold">Niet laden: spread te klein</div>';
                      html += '<div style="color:var(--secondary-text-color)">Beste verkoop&nbsp;: <span style="color:var(--primary-text-color);font-weight:bold">' + besteVerkoop.toFixed(1) + ' ct</span></div>';
                      html += '<div style="color:var(--secondary-text-color)">Nodig bij drempel: <span style="color:var(--primary-text-color);font-weight:bold">' + nodigeVerkoop.toFixed(1) + ' ct</span></div>';
                      html += '<div style="color:var(--secondary-text-color)">Min. spread&nbsp;&nbsp;&nbsp;: <span style="color:var(--primary-text-color);font-weight:bold">' + minSpread.toFixed(1) + ' ct</span></div>';
                      html += '<div style="color:var(--secondary-text-color)">Tekort&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;: <span style="color:var(--primary-text-color);font-weight:bold">' + spreadTekort.toFixed(1) + ' ct</span></div>';
                    }
                    html += '</div>';
                    return html;
                  }
              xaxis:
                labels:
                  style:
                    colors: >-
                      color-mix(in srgb, var(--primary-text-color) 75%,
                      transparent)
                axisTicks:
                  show: false
                axisBorder:
                  color: color-mix(in srgb, var(--divider-color) 50%, transparent)
              yaxis:
                - id: percentage
                  seriesName: SoC
                  min: 0
                  max: 105
                  decimalsInFloat: 0
                  labels:
                    style:
                      colors: >-
                        color-mix(in srgb, var(--primary-text-color) 75%,
                        transparent)
                    formatter: |
                      EVAL:function(v) { return v.toFixed(0) + ' %' }
                - id: prijs
                  seriesName: Prijs
                  opposite: true
                  decimalsInFloat: 0
                  labels:
                    style:
                      colors: >-
                        color-mix(in srgb, var(--primary-text-color) 75%,
                        transparent)
                    formatter: |
                      EVAL:function(v) { return v.toFixed(0) + ' ct' }
                - id: extra
                  seriesName: Vermogen
                  show: false
              grid:
                strokeDashArray: 0
                borderColor: color-mix(in srgb, var(--divider-color) 50%, transparent)
                show: true
              chart:
                height: 300px
                events:
                  updated: |
                    EVAL:function(chartContext, config) {
                      var root = document.querySelector('home-assistant');
                      var hass = root && root.hass;
                      var strategy = hass && hass.states['sensor.dynamisch_handelsstrategie'];
                      var desiredMax = strategy && Date.parse(strategy.attributes.strategie_einde);
                      var xaxis = config && config.config && config.config.xaxis;
                      var currentMin = Number(xaxis && xaxis.min);
                      var currentMax = Number(xaxis && xaxis.max);
                      if (!Number.isFinite(desiredMax) || !Number.isFinite(currentMin) || desiredMax <= currentMin) return;
                      if (Number.isFinite(currentMax) && Math.abs(currentMax - desiredMax) <= 1000) return;
                      if (chartContext.__strategieAxisUpdatePending) return;
                      chartContext.__strategieAxisUpdatePending = true;
                      window.requestAnimationFrame(function() {
                        var update = chartContext.updateOptions({ xaxis: { min: currentMin, max: desiredMax } }, false, false, false);
                        if (update && typeof update.finally === 'function') {
                          update.finally(function() { chartContext.__strategieAxisUpdatePending = false; });
                        } else {
                          chartContext.__strategieAxisUpdatePending = false;
                        }
                      });
                    }
                toolbar:
                  show: false
                zoom:
                  enabled: false
              legend:
                show: true
                floating: true
                horizontalAlign: left
                offsetX: 25
                offsetY: 17
              markers:
                size: 0
                hover:
                  size: 0
          - type: custom:apexcharts-card
            experimental:
              hidden_by_default: true
              color_threshold: true
            cache: false
            update_delay: 2s
            header:
              show: true
              show_states: false
              title: Geplande acties (groen = laden, oranje = ontladen)
            graph_span: 48h
            span:
              start: hour
            now:
              show: true
              label: Nu
              color: '#ef5350'
            series:
              - entity: sensor.dynamisch_handelsstrategie
                name: Vermogen
                type: column
                float_precision: 0
                unit: W
                color_threshold:
                  - value: -9999
                    color: '#ff7043'
                  - value: 0
                    color: '#66bb6a'
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.actie === 'laden'    ?  (s.vermogen_w ?? 0) :
                    s.actie === 'ontladen' ? -(s.vermogen_w ?? 0) :
                    null
                  ]);
              - entity: input_boolean.dynamisch_handelsstrategie_berekening_bezig
                name: Refresh trigger
                type: line
                show:
                  in_chart: false
                  in_header: false
                  in_legend: false
                data_generator: |
                  return [[Date.now(), entity.state === 'on' ? 1 : 0]];
            apex_config:
              tooltip:
                x:
                  format: dd-MM HH:mm
              xaxis:
                labels:
                  style:
                    colors: >-
                      color-mix(in srgb, var(--primary-text-color) 75%,
                      transparent)
                axisTicks:
                  show: false
                axisBorder:
                  color: color-mix(in srgb, var(--divider-color) 50%, transparent)
              yaxis:
                decimalsInFloat: 0
                labels:
                  style:
                    colors: >-
                      color-mix(in srgb, var(--primary-text-color) 75%,
                      transparent)
                  formatter: |
                    EVAL:function(v) { return Math.abs(v).toFixed(0) + ' W' }
              grid:
                strokeDashArray: 0
                borderColor: color-mix(in srgb, var(--divider-color) 50%, transparent)
                show: true
              chart:
                height: 220px
                toolbar:
                  show: false
                zoom:
                  enabled: false
              legend:
                show: false
              markers:
                size: 0
                hover:
                  size: 0
          - type: custom:apexcharts-card
            experimental:
              hidden_by_default: true
              color_threshold: true
            cache: false
            update_delay: 2s
            header:
              show: true
              show_states: false
              title: Verwachte winst per slot (groen = opbrengst, rood = kosten)
            graph_span: 48h
            span:
              start: hour
            now:
              show: true
              label: Nu
              color: '#ef5350'
            series:
              - entity: sensor.dynamisch_handelsstrategie
                name: Winst
                type: column
                float_precision: 2
                unit: ct
                color_threshold:
                  - value: -9999
                    color: '#ef5350'
                  - value: 0
                    color: '#66bb6a'
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    (s.winst_eur ?? 0) !== 0
                      ? parseFloat(((s.winst_eur ?? 0) * 100).toFixed(2))
                      : null
                  ]);
              - entity: input_boolean.dynamisch_handelsstrategie_berekening_bezig
                name: Refresh trigger
                type: line
                show:
                  in_chart: false
                  in_header: false
                  in_legend: false
                data_generator: |
                  return [[Date.now(), entity.state === 'on' ? 1 : 0]];
            apex_config:
              tooltip:
                x:
                  format: dd-MM HH:mm
              xaxis:
                labels:
                  style:
                    colors: >-
                      color-mix(in srgb, var(--primary-text-color) 75%,
                      transparent)
                axisTicks:
                  show: false
                axisBorder:
                  color: color-mix(in srgb, var(--divider-color) 50%, transparent)
              yaxis:
                decimalsInFloat: 1
                labels:
                  style:
                    colors: >-
                      color-mix(in srgb, var(--primary-text-color) 75%,
                      transparent)
                  formatter: |
                    EVAL:function(v) { return v.toFixed(1) + ' ct' }
              grid:
                strokeDashArray: 0
                borderColor: color-mix(in srgb, var(--divider-color) 50%, transparent)
                show: true
              chart:
                height: 200px
                toolbar:
                  show: false
                zoom:
                  enabled: false
              legend:
                show: false
              markers:
                size: 0
                hover:
                  size: 0
          - type: custom:apexcharts-card
            experimental:
              color_threshold: true
            cache: false
            update_delay: 2s
            header:
              show: true
              show_states: true
              title: Werkelijk handelsresultaat uit kwartieradministratie
            graph_span: 30d
            series:
              - entity: sensor.zendure_2400_ac_kwartieradministratie
                name: Dagresultaat
                type: column
                float_precision: 2
                unit: EUR
                color_threshold:
                  - value: -9999
                    color: '#ef5350'
                  - value: 0
                    color: '#66bb6a'
                show:
                  in_chart: true
                  in_header: false
                  in_legend: true
                data_generator: |
                  return (entity.attributes.dagresultaten || []).map(dag => [
                    new Date(dag.start).getTime(),
                    Number.isFinite(Number(dag.netto_eur))
                      ? Number(dag.netto_eur)
                      : null
                  ]);
              - entity: sensor.zendure_2400_ac_kwartieradministratie
                name: Cumulatief
                type: line
                curve: stepline
                color: '#01a180'
                stroke_width: 2
                float_precision: 2
                unit: EUR
                show:
                  in_chart: true
                  in_header: true
                  in_legend: true
                data_generator: |
                  return (entity.attributes.dagresultaten || []).map(dag => [
                    new Date(dag.start).getTime(),
                    Number.isFinite(Number(dag.cumulatief_eur))
                      ? Number(dag.cumulatief_eur)
                      : null
                  ]);
            apex_config:
              tooltip:
                shared: true
                intersect: false
                x:
                  format: dd-MM-yyyy
                y:
                  formatter: |
                    EVAL:function(v) { return 'EUR ' + Number(v).toFixed(2) }
              xaxis:
                type: datetime
                labels:
                  datetimeUTC: false
                  style:
                    colors: >-
                      color-mix(in srgb, var(--primary-text-color) 75%,
                      transparent)
                axisTicks:
                  show: false
                axisBorder:
                  color: color-mix(in srgb, var(--divider-color) 50%, transparent)
              yaxis:
                decimalsInFloat: 2
                labels:
                  style:
                    colors: >-
                      color-mix(in srgb, var(--primary-text-color) 75%,
                      transparent)
                  formatter: |
                    EVAL:function(v) { return 'EUR ' + Number(v).toFixed(2) }
              grid:
                strokeDashArray: 0
                borderColor: color-mix(in srgb, var(--divider-color) 50%, transparent)
                show: true
              chart:
                height: 240px
                toolbar:
                  show: false
                zoom:
                  enabled: false
              legend:
                show: true
              markers:
                size: 0
                hover:
                  size: 3
          - type: heading
            heading: Thermisch model
            heading_style: title
          - type: custom:apexcharts-card
            cache: false
            update_delay: 2s
            header:
              show: true
              show_states: false
              title: Temperatuur over planning
            graph_span: 48h
            span:
              start: hour
            now:
              show: true
              label: Nu
              color: '#ef5350'
            series:
              - entity: sensor.dynamisch_handelsstrategie
                name: Batterij
                type: line
                curve: straight
                color: '#009688'
                stroke_width: 2
                unit: °C
                yaxis_id: temp
                data_generator: |
                  const slots = entity.attributes.slots || [];
                  const pts = slots.map(s => [
                    new Date(s.start).getTime(),
                    s.batterij_temp_voor_c ?? null
                  ]);
                  if (slots.length) {
                    const last = slots[slots.length - 1];
                    pts.push([
                      new Date(last.end).getTime(),
                      last.batterij_temp_na_c ?? null
                    ]);
                  }
                  return pts;
              - entity: sensor.dynamisch_handelsstrategie
                name: Buiten
                type: line
                curve: stepline
                color: '#42a5f5'
                stroke_width: 1
                unit: °C
                yaxis_id: temp
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.buiten_temp_c ?? null
                  ]);
              - entity: sensor.dynamisch_handelsstrategie
                name: Limiet
                type: line
                curve: stepline
                color: '#ef5350'
                stroke_width: 1
                unit: °C
                yaxis_id: temp
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.temp_limiet_c ?? entity.attributes.temp_limiet_c ?? null
                  ]);
              - entity: sensor.dynamisch_handelsstrategie
                name: Risico
                type: column
                color: '#ef5350'
                opacity: 0.35
                unit: °C
                yaxis_id: temp
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [
                    new Date(s.start).getTime(),
                    s.temp_limiet_actief && (s.overtemp_penalty_eur ?? s.temp_penalty_eur ?? 0) > 0
                      ? s.batterij_temp_na_c
                      : null
                  ]);
              - entity: sensor.dynamisch_handelsstrategie
                name: Δ accutemp
                type: column
                color: '#5c6bc0'
                opacity: 0.55
                unit: °C
                yaxis_id: delta
                data_generator: |
                  return (entity.attributes.slots || []).map(s => {
                    const voor = Number(s.batterij_temp_voor_c);
                    const na = Number(s.batterij_temp_na_c);
                    return [
                      new Date(s.start).getTime(),
                      Number.isFinite(voor) && Number.isFinite(na)
                        ? parseFloat((na - voor).toFixed(2))
                        : null
                    ];
                  });
              - entity: input_boolean.dynamisch_handelsstrategie_berekening_bezig
                name: Refresh trigger
                type: line
                yaxis_id: helper
                show:
                  in_chart: false
                  in_header: false
                  in_legend: false
                data_generator: |
                  return [[Date.now(), entity.state === 'on' ? 1 : 0]];
            yaxis:
              - id: temp
                decimals: 1
                apex_config:
                  labels:
                    formatter: |
                      EVAL:function(v) { return v.toFixed(1) + ' °C' }
              - id: delta
                opposite: true
                decimals: 2
                apex_config:
                  labels:
                    formatter: |
                      EVAL:function(v) { return v.toFixed(2) + ' Δ°C' }
              - id: helper
                show: false
            apex_config:
              tooltip:
                x:
                  format: dd-MM HH:mm
              chart:
                height: 220px
                toolbar:
                  show: false
                zoom:
                  enabled: false
              legend:
                show: true
              markers:
                size: 0
                hover:
                  size: 3
          - type: custom:apexcharts-card
            cache: false
            update_delay: 2s
            header:
              show: true
              show_states: false
              title: Straf per slot
            graph_span: 48h
            span:
